<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Register.css">
  <title>Document</title>

</head>
  <body>
<a href="index.html"><img class="image-top" src="Icons/arrow-back-2.svg" alt=""></a>
  <div class="container">

    <span class="success-message"></span>
    <span class="succefuly-register-messeage"></span>
<div class="form-direction"> 
    

 


  <form id="register-form" action="/reg/sub">

  <div class="form-rap">
 <h1>SIGNUP</h1>
 

  <div class="column">
<label for="first name">Full name</label>
<div class="input-rap"><div class="input-image-background"><img class="input-image" src="Icons/person-outline.svg" alt=""></div>

<input id="first-name" type="text" name="first name" placeholder="Enter your first name" ></div>
<span id="first-name-error" class="error-message"></span>
</div>




<div class="column">
<label for="last name">Username</label>
<div class="input-rap"><div class="input-image-background"><img class="input-image" src="Icons/person-outline.svg" alt=""></div>

<input id="user-name" type="text" name="user name" placeholder="Enter your username" ></div>
<span id="user-name-error" class="error-message"></span>
</div>



<div class="column">
<label for="email">Email</label>
<div class="input-rap"><div class="input-image-background"><img class="input-image" src="Icons/mail-outline.svg" alt=""></div>

<input id="email" type="email" name="Email" placeholder="Enter your email address" ></div>

<span id="email-error" class="error-message"></span>
</div>




<div class="column">
<label for="password">Password</label>
<div class="input-rap"><div class="input-image-background"><img class="input-image" src="Icons/key-outline.svg" alt=""></div>

<input id="password" type="text" name="last name" placeholder="Enter your password" ></div>
<span id="password-error" class="error-message"></span>
</div>



<div class="column">
<label for="C password">Confirm Password</label>
<div class="input-rap"><div class="input-image-background"><img class="input-image" src="Icons/key-outline.svg" alt=""></div>

<input id="Confirm password" type="text" name="password" placeholder="confirm your password" ></div>
<span id="confirm-password-error" class="error-message"></span>
</div>



<div class="button-direction">

<button onclick="register()">SIGNUP</button></div>
<h3>Already have an account?<a href="Login.html">Login</a>
</div>
</h3>

  </form>

</div>

</div>


<script src="secong.js"></script>
</body>
</html>
