<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="BETTING.css">
    <title>BETTING</title>
</head>
<body>
     
<header>
    <div class="hearder-rap">
        <a href="Home page.html">  <img class="image-top" src="Icons/arrow-back-2.svg" alt=""></a>
  
    <span class="SPORT-BETTING">SPORT BETTING</span></div>
</header>


<div class="container">


<div class="logos-direction">
<div class="logos">

<img class="image-icon" src="images/Sporty.jpg" alt="">

 <img class="image-icon" src="images/Msport.jpg" alt="">

 <img class="image-icon" src="images/1xbet.jpg" alt="">

 <img class="image-icon" src="images/Bet9ja.jpg" alt="">

 <img class="image-icon" src="images/Betking.jpg" alt="">
</div></div>

<div class="form-direction">
<form class="form-rap" action="/data/submite" method="get">

   <div class="network-rap">
    <label for="platform"> Platform*</label>
    <select name="Category" id="platform" required>
        <option value="platform">Choose</option>
        
        <option value="MSPORT"> <div> MSPORT</div></option>
        <option value="1XBET"> 1XBET</option>
        <option value="SPORTY"> SPORTY</option>
        <option value="BETKING">BETKING</option>
        <option value="BET9JA">Bet9ja</option>
        <option value="BANGBET">BANGBET</option>
        <option value="ILOT">ILOT</option>
        <option value="NAIRABET">NAIRABET</option>
    </select></div>

    <div class="network-rap">
<div class="network-rap-last">
    <label for="Amount"> Amount*</label>
    <input type="number" name="Amount" placeholder="min:200" required min="3"></div>


<div class="network-rap-last">
    <label for="UID">UID*</label>
    <input type="text" name="UID" placeholder="Input your UID" required min="4"></div>





</div>
<button>Confirm</button>
</form>

</div>






</div>
</body>
</html>
